<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد خلاصة السادس</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    <!-- ضع هذا السطر داخل الـ <head> -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  body {
    margin: 0; padding: 0;
    background-color: #000000; 
    min-height: 100vh;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden; 
    position: relative;
  }

  #snow-container {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }

  .snowflake {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-10px); }
    100% { transform: translateY(110vh); }
  }

  .container {
    backdrop-filter: blur(5px);
    background: rgba(0, 0, 0, 0.8);
    padding: 20px;
    border-radius: 25px;
    width: 90%; 
    max-width: 420px; 
    border: 2px solid #c5a059;
    box-shadow: 0 10px 40px rgba(197, 160, 89, 0.2);
    text-align: center;
    z-index: 10;
    margin: 20px;
  }

  h1 { 
    margin-bottom: 10px; 
    font-size: 1.8rem; 
    color: #f1d38e; 
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
  }

  h0 { color: #ccc; font-size: 0.9rem; display: block; margin-bottom: 20px; }

  .exam-box {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px;
    border-radius: 18px;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(197, 160, 89, 0.3);
  }

  h2 { 
    margin: 0 0 12px 0; 
    color: #e3c07e; 
    font-size: 0.95rem;
  }

  .next-exam-label {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #f1d38e;
    font-weight: bold;
    background: rgba(197, 160, 89, 0.1);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .counter {
    font-size: 1.2rem;
    font-weight: bold;
    color: #ffffff;
    direction: ltr; 
    display: flex;
    justify-content: center;
    gap: 5px;
  }

  .time-part {
    background: rgba(197, 160, 89, 0.15);
    padding: 8px 5px;
    border-radius: 10px;
    flex: 1; 
    min-width: 50px;
    border: 1px solid rgba(197, 160, 89, 0.2);
  }

  .unit { 
    font-size: 10px; 
    color: #c5a059; 
    display: block;
    margin-top: 3px;
    font-weight: normal;
  }

  .tg-button {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 15px;
    padding: 12px;
    background: linear-gradient(45deg, #c5a059, #f1d38e);
    color: #1a160c !important;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 1rem;
    transition: 0.3s;
  }

  .footer-credit { margin-top: 15px; font-size: 12px; }
  .footer-credit a { color: rgba(241, 211, 142, 0.8) !important; text-decoration: none; }

  .list-button {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    padding: 10px;
    background: rgba(197, 160, 89, 0.12);
    color: #f1d38e;
    border: 1px solid rgba(197, 160, 89, 0.4);
    border-radius: 12px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    transition: 0.3s;
    font-family: inherit;
  }
  .list-button:hover { background: rgba(197, 160, 89, 0.22); }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(3px);
    z-index: 50;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active { display: flex; }

  .modal-box {
    background: #100d08;
    border: 2px solid #c5a059;
    border-radius: 20px;
    width: 90%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 18px;
    box-shadow: 0 10px 40px rgba(197, 160, 89, 0.25);
  }

  .modal-title {
    color: #f1d38e;
    font-size: 1.1rem;
    margin: 0 0 12px 0;
    text-align: center;
  }

  .modal-close {
    display: block;
    margin: 14px auto 0 auto;
    padding: 8px 20px;
    background: linear-gradient(45deg, #c5a059, #f1d38e);
    color: #1a160c;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }

  .modal-round-title {
    color: #e3c07e;
    font-size: 0.85rem;
    margin: 14px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(197, 160, 89, 0.3);
    text-align: right;
  }

  .subject-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }

  .subject-row .subject-name {
    font-size: 0.85rem;
    color: #ffffff;
  }

  /* تنسيق حاوية الوقت الجديدة لحل مشكلة التداخل بالكامل */
  .subject-remaining-container {
    display: flex;
    direction: ltr;
    gap: 4px;
    font-size: 0.8rem;
    align-items: center;
  }

  .subject-remaining-container .num {
    color: #f1d38e;
    font-weight: bold;
  }

  .subject-remaining-container .lbl {
    color: #8a7346;
    font-size: 0.7rem;
    margin-right: 2px;
  }

  .subject-row.done .subject-remaining-container .num,
  .subject-row.done .subject-remaining-container .lbl {
    color: #6fbf73;
  }
  /* في الـ CSS */
.home-btn {
    
  background-color:#f1d38e
  ;
  border: none;
  color:#8a7346;
  padding: 12px 16px;
  font-size: 20px; /* يتحكم بحجم أيقونة البيت */
  border-radius: 30px; /* يجعله زر دائري */
  cursor: pointer;
  position: fixed;
  top: 20px;
  right: 20px;
  
}
</style>
</head>

<body>

<div id="snow-container"></div>

<div class="container">
  <h1>✨عداد الوزاري✨ </h1>
  <h0>توكل على الله و اقره عدل</h0>
  
  <div class="exam-box">
    <h2>🗓️ المتبقي للدور الأول</h2>
    <div id="counter1" class="counter">00 : 00 : 00 : 00</div>
    <div id="next-exam-name" class="next-exam-label">جاري مزامنة الوقت...</div>
  </div>

  <div class="exam-box">
    <h2>🗓️ المتبقي للدور الثاني</h2>
    <div id="counter2" class="counter">00 : 00 : 00 : 00</div>
    <div id="next-exam-name-2" class="next-exam-label">جاري مزامنة الوقت...</div>
  </div>

  <button class="list-button" id="open-list-btn">📋الجدول</button>

  <a href="https://t.me/tlv_12" target="_blank" class="tg-button">خلاصة السادس</a>
  <div class="footer-credit">
    <a href="https://t.me/Not_Wdh" target="_blank">Created By: @Not_Wdh</a>
  </div>
</div>

<div class="modal-overlay" id="list-modal">
  <div class="modal-box">
    <h3 class="modal-title">⏳ الوقت المتبقي لكل مادة</h3>
    <div class="modal-round-title">الدور الأول</div>
    <div id="list-round1"></div>
    <div class="modal-round-title">الدور الثاني</div>
    <div id="list-round2"></div>
    <button class="modal-close" id="close-list-btn">إغلاق</button>
  </div>
</div>
<!-- في الـ HTML -->
<a href="https://tlv-12.vercel.app/"> 
  <button class="home-btn">
    <i class="fas fa-home"></i>
  </button>
</a>
  

<script>
// تحديد التواريخ مع مراعاة المنطقة الزمنية للعراق (UTC+3) لضمان الدقة
const schedule = [
  { name: "الاحياء", date: new Date("2027-06-01T07:00:00+03:00").getTime() },
  { name: "كوردي", date: new Date("2027-06-04T07:00:00+03:00").getTime() },
  { name: "الرياضيات", date: new Date("2027-06-08T07:00:00+03:00").getTime() },
  { name: "العربي/دين اسلامي", date: new Date("2027-06-11T07:00:00+03:00").getTime() },
  { name: "الكيمياء", date: new Date("2027-06-15T07:00:00+03:00").getTime() },
  { name: "الانكليزي", date: new Date("2027-06-18T07:00:00+03:00").getTime() },
  { name: "الفيزياء", date: new Date("2027-06-22T07:00:00+03:00").getTime() },
  { name: "سرياني/دين مسيحي ", date: new Date("2027-06-25T07:00:00+03:00").getTime() }
];

// جدول الدور الثاني: نفس أسماء مواد الدور الأول وبنفس ترتيبها وفواصلها الزمنية،
// مع بداية من تاريخ 2026-08-11 (يمكن تعديل التواريخ لاحقاً إذا صدر جدول رسمي مختلف)
const schedule2 = [
  { name: "الاحياء", date: new Date("2027-08-11T07:00:00+03:00").getTime() },
  { name: "كوردي", date: new Date("2027-08-13T07:00:00+03:00").getTime() },
  { name: "الرياضيات", date: new Date("2027-08-16T07:00:00+03:00").getTime() },
  { name: "العربي/دين اسلامي", date: new Date("2027-08-18T07:00:00+03:00").getTime() },
  { name: "الكيمياء", date: new Date("2027-08-20T07:00:00+03:00").getTime() },
  { name: "الانكليزي", date: new Date("2027-08-23T07:00:00+03:00").getTime() },
  { name: "الفيزياء", date: new Date("2027-08-27T07:00:00+03:00").getTime() },
  { name: "سرياني/دين مسيحي ", date: new Date("2027-08-30T07:00:00+03:00").getTime() }
];

const secondDate = schedule2[schedule2.length - 1].date;

// متغير لحفظ الوقت الحقيقي
let currentTime;

async function syncTime() {
    try {
        // جلب الوقت من سيرفر خارجي لضمان عدم تلاعب الطلاب بالوقت
        const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Baghdad');
        const data = await response.json();
        currentTime = new Date(data.datetime).getTime();
    } catch (e) {
        // في حال فشل الاتصال، نعتمد وقت الجهاز كخيار أخير
        currentTime = new Date().getTime();
    }
}

function updateAllCounters() {
  if (!currentTime) return; // انتظر حتى يتم جلب الوقت

  currentTime += 1000; // زيادة ثانية واحدة برمجياً
  const now = currentTime;

  const currentExam = schedule.find(exam => exam.date > now);
  const nextExamDiv = document.getElementById("next-exam-name");
  
  if (currentExam) {
      nextExamDiv.innerText = `الامتحان القادم: ${currentExam.name}`;
      render(currentExam.date, "counter1", now);
  } else {
      nextExamDiv.innerText = `انتهت امتحانات الدور الأول`;
      document.getElementById("counter1").innerHTML = "انتهت!";
  }

  const currentExam2 = schedule2.find(exam => exam.date > now);
  const nextExamDiv2 = document.getElementById("next-exam-name-2");

  if (currentExam2) {
      nextExamDiv2.innerText = `الامتحان القادم: ${currentExam2.name}`;
      render(currentExam2.date, "counter2", now);
  } else {
      nextExamDiv2.innerText = `انتهت امتحانات الدور الثاني`;
      document.getElementById("counter2").innerHTML = "انتهت!";
  }

  updateModalList(now);
}

// دالة مُحدثة بالكامل لإنتاج هيكلية HTML منفصلة ومرتبة بدلاً من النص المتداخل
function formatRemaining(distance) {
  if (distance < 0) {
    return `<div class="subject-remaining-container"><span class="num" style="color: #6fbf73;">انتهت</span></div>`;
  }
  const d = Math.floor(distance / (1000 * 60 * 60 * 24));
  const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const s = Math.floor((distance % (1000 * 60)) / 1000);
  const format = (num) => String(num).padStart(2, '0');
  
  return `
    <div class="subject-remaining-container">
      <span class="num">${d}</span><span class="lbl">ي</span>
      <span class="num">${format(h)}</span><span class="lbl">س</span>
      <span class="num">${format(m)}</span><span class="lbl">د</span>
      <span class="num">${format(s)}</span><span class="lbl">ث</span>
    </div>
  `;
}

function buildSubjectRows(list, containerId, now) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = list.map(exam => {
    const distance = exam.date - now;
    const done = distance < 0;
    return `
      <div class="subject-row ${done ? 'done' : ''}">
        <span class="subject-name">${exam.name}</span>
        ${formatRemaining(distance)}
      </div>
    `;
  }).join("");
}

function updateModalList(now) {
  const modal = document.getElementById("list-modal");
  if (!modal || !modal.classList.contains("active")) return;
  buildSubjectRows(schedule, "list-round1", now);
  buildSubjectRows(schedule2, "list-round2", now);
}

function render(target, elementId, now) {
    const el = document.getElementById(elementId);
    if (!el) return;
    
    const distance = target - now;
    if (distance < 0) {
        el.innerHTML = "بدأت!";
        return;
    }

    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((distance % (1000 * 60)) / 1000);
    const format = (num) => String(num).padStart(2, '0');

    el.innerHTML = `
      <div class="time-part">${format(s)}<span class="unit">ثانية</span></div>
      <div class="time-part">${format(m)}<span class="unit">دقيقة</span></div>
      <div class="time-part">${format(h)}<span class="unit">ساعة</span></div>
      <div class="time-part">${d}<span class="unit">يوم</span></div>
    `;
}

function createSnowflake() {
  const snowContainer = document.getElementById('snow-container');
  if(!snowContainer) return;
  const snowflake = document.createElement('div');
  snowflake.classList.add('snowflake');
  snowflake.style.left = Math.random() * 100 + 'vw';
  snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
  snowflake.style.opacity = Math.random();
  snowflake.style.width = Math.random() * 4 + 2 + 'px';
  snowflake.style.height = snowflake.style.width;
  snowContainer.appendChild(snowflake);
  setTimeout(() => { snowflake.remove(); }, 5000);
}

// تشغيل الوظائف
syncTime().then(() => {
    setInterval(updateAllCounters, 1000);
    updateAllCounters();
});
setInterval(createSnowflake, 150);

// التحكم بنافذة قائمة المواد
const listModal = document.getElementById("list-modal");
const openListBtn = document.getElementById("open-list-btn");
const closeListBtn = document.getElementById("close-list-btn");

openListBtn.addEventListener("click", () => {
  listModal.classList.add("active");
  if (currentTime) updateModalList(currentTime);
});

closeListBtn.addEventListener("click", () => {
  listModal.classList.remove("active");
});

listModal.addEventListener("click", (e) => {
  if (e.target === listModal) listModal.classList.remove("active");
});

</script>

</body>
</html>
